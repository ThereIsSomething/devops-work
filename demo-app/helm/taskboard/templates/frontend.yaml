apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: taskboard-frontend}}
  template:
    metadata: {labels: {app: taskboard-frontend}}
    spec:
      {{- if .Values.imagePullSecret }}
      imagePullSecrets: [{name: {{ .Values.imagePullSecret }}}]
      {{- end }}
      securityContext: {runAsUser: 101, runAsNonRoot: true}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 25m, memory: 16Mi}, limits: {cpu: 250m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec:
  selector: {app: taskboard-frontend}
  ports: [{port: 80, targetPort: http}]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling
spec:
  replicas: 3
  selector:
    matchLabels: &id001
      app: rolling
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            cpu: 250m
            memory: 64Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

apiVersion: v1
kind: Service
metadata:
  name: postgres
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  clusterIP: None
  selector: {app: taskboard-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: taskboard-postgres}}
  template:
    metadata: {labels: {app: taskboard-postgres}}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresImage | quote }}
          imagePullPolicy: {{ .Values.postgresImagePullPolicy }}
          ports: [{containerPort: 5432}]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_DB, value: taskboard}
            - {name: POSTGRES_USER, value: taskboard}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: password}}
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U taskboard -d taskboard']}
            periodSeconds: 5
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storageSize }}

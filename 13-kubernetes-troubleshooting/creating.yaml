apiVersion: v1
kind: Pod
metadata:
  name: creating
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: busybox:1.37
    command:
    - sh
    - -c
    - sleep 3600
    volumeMounts:
    - name: missing
      mountPath: /config
  volumes:
  - name: missing
    secret:
      secretName: missing-volume
